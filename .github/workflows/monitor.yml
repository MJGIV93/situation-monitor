name: monitor

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour when GitHub is busiest.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous data
        run: |
          mkdir -p out
          if git fetch --quiet --depth 1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Probe sources
        run: node fetcher/probe.mjs

      - name: Trim run log
        run: tail -n 2000 out/probe-log.jsonl > out/log.tmp && mv out/log.tmp out/probe-log.jsonl

      - name: Save data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf .git
          git init --quiet --initial-branch data
          git config user.name "situation-monitor"
          git config user.email "situation-monitor@users.noreply.github.com"
          git add --all
          git commit --quiet --message "data $(date -u +%FT%TZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp out/*.json out/*.jsonl _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Stays green until Pages is switched on in the repository settings.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
