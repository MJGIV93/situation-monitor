name: monitor

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour when GitHub is busiest.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous data
        run: |
          mkdir -p out
          if git fetch --quiet --depth 1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Fetch and score
        run: node fetcher/run.mjs

      - name: Trim run log
        run: |
          tail -n 3000 out/runs.jsonl > out/runs.tmp && mv out/runs.tmp out/runs.jsonl
          rm -f out/probe.json out/probe-log.jsonl

      - name: Save data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf .git
          git init --quiet --initial-branch data
          git config user.name "situation-monitor"
          git config user.email "situation-monitor@users.noreply.github.com"
          git add --all
          git commit --quiet --message "data $(date -u +%FT%TZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # Once a day, a copy of the data is committed to a branch that keeps its history.
      - name: Daily backup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%F)
          rm -rf /tmp/hist && mkdir /tmp/hist && cd /tmp/hist
          git init --quiet --initial-branch data-history
          git config user.name "situation-monitor"
          git config user.email "situation-monitor@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth 1 origin data-history 2>/dev/null; then
            git reset --quiet --soft FETCH_HEAD
            if [ "$(git log -1 --format=%cd --date=format:%F)" = "$today" ]; then exit 0; fi
          fi
          cp -r "$GITHUB_WORKSPACE/out/archive" .
          cp "$GITHUB_WORKSPACE/out/state.json" "$GITHUB_WORKSPACE/out/runs.jsonl" .
          git add --all
          git commit --quiet --message "backup $today"
          git push --quiet origin data-history

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp out/latest.json _site/data/
          # Stamp the build so browsers fetch the scoring rules that match this page.
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
